<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/jpeg" href="/ui/img/dffrnt_favicon.jpg" />
<title>DFFRNT AI Assistant</title>
<meta name="description" content="Branded AI assistant with chat and a document library, served fully offline." />
<!--
  DFFRNT AI Assistant — vanilla HTML/CSS/JS UI (no npm, no framework, no CDN).
  Design language ported from the Figma "Conversational AI Assistant UI" prototype.

  Assets live under /ui (served by a StaticFiles mount in api/app.py) and are split
  into native ES modules + plain CSS — no build step, works on an air-gapped box.
    styles/  fonts · theme · layout · chat · markdown · library · tags
    js/      util · icons · markdown · state · api · sidebar · chat · scope ·
             library · upload · tags · settings · app (entry)

  Implemented against the live backend: streaming chat with thinking, tag-scoped
  retrieval, saved conversations, the document library (tag display/search/filter
  + per-doc tag editing), upload (validation, per-file tags, duplicate handling),
  and tag taxonomy CRUD + import.

  Intentionally out of scope (no backend support / not portable to an offline
  served app):
    - Per-file/folder upload descriptions (the backend stores no description field).
    - Opening the original source/document file (browser file:// access is blocked).
-->
<link rel="stylesheet" href="/ui/styles/fonts.css" />
<link rel="stylesheet" href="/ui/styles/theme.css" />
<link rel="stylesheet" href="/ui/styles/layout.css" />
<link rel="stylesheet" href="/ui/styles/chat.css" />
<link rel="stylesheet" href="/ui/styles/markdown.css" />
<link rel="stylesheet" href="/ui/styles/library.css" />
<link rel="stylesheet" href="/ui/styles/tags.css" />
<script type="module" src="/ui/js/app.js"></script>
</head>
<body>
<div class="app">
  <!-- ── Sidebar ──────────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="logo" src="/ui/img/dffrnt_logo.jpeg" alt="DFFRNT logo" />
      <span class="name">DFFRNT AI Assistant</span>
      <button class="toggle" id="sidebarToggle" title="Collapse sidebar"><span data-icon="panelLeft" class="icon"></span></button>
    </div>

    <div class="nav">
      <button class="nav-btn" id="navNewChat" title="New chat"><span data-icon="plus" class="icon"></span><span>New chat</span></button>
      <button class="nav-btn" id="navLibrary" title="Document Library"><span data-icon="library" class="icon"></span><span>Document Library</span></button>
    </div>

    <div class="recent-label">
      <span data-icon="clock" class="icon"></span> RECENT
      <button class="recent-clear" id="clearHistoryBtn" title="Clear all conversations"><span data-icon="trash" class="icon"></span></button>
    </div>
    <div class="search-wrap">
      <span data-icon="search" class="icon"></span>
      <input id="chatSearch" placeholder="Search chats…" />
    </div>
    <div class="history scroll-none" id="chatHistory"></div>
  </aside>

  <!-- ── Main ─────────────────────────────────────────────────────── -->
  <main class="main">
    <div class="topbar">
      <span class="title" id="topbarTitle">New conversation</span>
    </div>
    <div class="content">
      <!-- Chat panel -->
      <section class="chat" id="chatPanel">
        <div class="chat-scope" id="chatScope"></div>
        <div class="messages scroll-thin" id="messages"></div>
        <div class="composer-wrap">
          <div class="composer-tools">
            <button class="think-toggle" id="thinkingToggle" title="Toggle thinking">
              <span data-icon="brain" class="icon"></span>
              <span class="tt-text" id="thinkingText">Thinking on</span>
              <span class="switch" id="thinkingSwitch"><span class="knob"></span></span>
            </button>
          </div>
          <div class="composer">
            <textarea id="composer" rows="1" placeholder="Ask anything about your documents…"></textarea>
            <div class="row">
              <span class="count" id="charCount"></span>
              <button class="send-btn" id="sendBtn" title="Send (Enter)"><span data-icon="send" class="icon"></span></button>
            </div>
          </div>
          <p class="disclaimer">AI can make mistakes. Verify important information from source documents.</p>
        </div>
      </section>

      <!-- Library panel -->
      <section class="library hidden" id="libraryPanel">
        <div class="library-inner">
          <div class="lib-head">
            <div>
              <h2>Document Library</h2>
              <p id="libSubtitle">Documents available to the assistant's knowledge base.</p>
            </div>
            <div class="lib-actions">
              <button class="btn btn-ghost" id="manageTagsBtn"><span data-icon="settings" class="icon"></span> Manage Tags</button>
              <button class="btn btn-primary" id="uploadOpenBtn"><span data-icon="upload" class="icon"></span> Upload</button>
            </div>
          </div>

          <div class="ai-storage" id="aiStorage"></div>

          <div class="doc-search">
            <span data-icon="search" class="icon"></span>
            <input id="docSearch" placeholder="Search documents…" />
          </div>
          <div class="doc-filter" id="docFilter"></div>
          <div id="docList"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<!-- Tag Manager modal -->
<div class="modal-overlay hidden" id="tagModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title"><span data-icon="tag" class="icon"></span> Tag Manager</div>
      <button class="modal-close" id="tagModalClose" title="Close"><span data-icon="x" class="icon"></span></button>
    </div>
    <div class="modal-body" id="tagModalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-primary" id="tagModalDone">Done</button>
    </div>
  </div>
</div>

<!-- Confirm dialog (reusable; replaces the browser's native confirm) -->
<div class="modal-overlay hidden" id="confirmModal">
  <div class="modal confirm-modal">
    <div class="confirm-body">
      <div class="confirm-icon" id="confirmIcon"><span data-icon="alert" class="icon"></span></div>
      <div class="confirm-text">
        <h3 id="confirmTitle">Are you sure?</h3>
        <p id="confirmMessage"></p>
      </div>
    </div>
    <div class="confirm-foot">
      <button class="btn btn-ghost" id="confirmCancel">Cancel</button>
      <button class="btn btn-primary" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<!-- Upload modal -->
<div class="modal-overlay hidden" id="uploadModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title"><span data-icon="upload" class="icon"></span> Upload Documents</div>
      <button class="modal-close" id="uploadModalClose" title="Close"><span data-icon="x" class="icon"></span></button>
    </div>
    <div class="modal-body" id="uploadModalBody"></div>
    <div class="modal-foot">
      <span class="up-summary" id="upSummary"></span>
      <div class="up-footbtns">
        <button class="btn btn-ghost" id="uploadCloseBtn">Cancel</button>
        <button class="btn btn-primary" id="uploadStartBtn">Upload</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
