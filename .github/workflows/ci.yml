name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test (Python 3.14)

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # Offline tests only; the integration/eval suites need live Qdrant +
      # Ollama and are excluded by the default pytest markers.
      - name: Run tests
        run: uv run pytest -v
